<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      One tag, not two. Light is the default and dark applies only from the
      in-app toggle (ADR-010), so a prefers-color-scheme-scoped theme-color
      would tint the address bar dark for a reader the page is still rendering
      light for. Matches --background in tokens.css :root.
    -->
    <meta name="theme-color" content="#F7F9FC" />
    <meta
      name="description"
      content="Sahayak — offline-first bilingual reference and productivity tool for Indian central government officers. Public data only."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Fonts are self-hosted from @fontsource and bundled by Vite
         (src/styles/fonts.css). No third-party request is made at runtime. -->

    <title>Sahayak · सरकारी सहायक</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
