# Weekly, grouped. Grouped deliberately: this project pins every dependency to
# an exact version (no ranges), so an ungrouped config opens one pull request
# per package and buries the two that matter — a security fix, and a major that
# needs an ADR — under thirty that do not.
#
# Every group here still runs the full CI workflow, which builds, checks the
# size budget, replays the production CSP in a real browser and runs the
# Playwright suite. That is what makes accepting a grouped bump safe.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The three that decide what the app IS. A major here is an ADR, not a
      # merge, so they are grouped apart from everything else.
      framework:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - '@types/react'
          - '@types/react-dom'
      build-tooling:
        patterns:
          - vite
          - '@vitejs/*'
          - '@tailwindcss/*'
          - tailwindcss
          - tw-animate-css
          - typescript
          - typescript-native
          - rollup-plugin-visualizer
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@playwright/*'
          - '@testing-library/*'
          - axe-core
          - fake-indexeddb
          - fast-check
          - jsdom
      lint-and-format:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - 'eslint-plugin-*'
          - prettier
          - 'prettier-plugin-*'
          - globals
      # The self-hosted font packages move together or not at all: a mismatched
      # pair would put two Inter versions in public/OFL.txt, which CI checks.
      fonts:
        patterns:
          - '@fontsource/*'
          - '@fontsource-variable/*'
      radix-and-ui:
        patterns:
          - '@radix-ui/*'
          - cmdk
          - lucide-react
          - class-variance-authority
          - clsx
          - tailwind-merge
      app-runtime:
        patterns:
          - dexie
          - dexie-react-hooks
          - zustand
          - zod
          - i18next
          - react-i18next
          - fuse.js
          - ts-fsrs
          - docx
          - recharts
          - date-fns
          - workbox-window
          - vite-plugin-pwa

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - '*'

  # The ingest and authoring pipelines share one requirements file and run in
  # GitHub Actions and by hand only — never in the browser (master context).
  - package-ecosystem: pip
    directory: /scripts/ingest
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      ingest-python:
        patterns:
          - '*'
