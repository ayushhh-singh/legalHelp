name: Law data refresh

# NCRB republishes the Sankalan correspondence tables without announcing it, so
# this checks weekly and opens a pull request only when the generated JSON
# actually changes. It never merges: a change to what the law says is a thing a
# human reads before it reaches a reader.
#
# India Code is deliberately absent. Its robots.txt restricts crawling and
# CLAUDE.md forbids scheduling it, so scripts/ingest/indiacode_seed.py is run by
# hand and its overlay is merged here without ever being regenerated.

on:
  schedule:
    # Monday 03:00 IST = Sunday 21:30 UTC. GitHub cron has no timezone.
    - cron: '30 21 * * 0'
  workflow_dispatch:
    inputs:
      force_pdf:
        description: 'Parse the correspondence tables from the PDFs instead of the HTML'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest-law
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ingest/requirements.txt

      - name: Install the ingest dependencies
        run: pip install -r scripts/ingest/requirements.txt

      - name: Unit-test the parsers before trusting them with a refresh
        run: python -m unittest discover -s scripts/ingest -t scripts/ingest -v

      - name: Fetch NCRB Sankalan and rebuild data/law
        id: ingest
        run: |
          if [ "${{ inputs.force_pdf }}" = "true" ]; then
            python scripts/ingest/ncrb_sankalan.py --force-pdf
          else
            python scripts/ingest/ncrb_sankalan.py
          fi

      # The overlays are hand-curated and the ingest only ever reads them. If a
      # run has rewritten one, something has changed in the script that must not
      # ship: the whole point of the split is that the cron cannot edit them.
      #
      # `git status --porcelain`, not `git diff`: diff cannot see a *new* file,
      # so a script that started writing its own overlay would have walked
      # straight past this guard.
      - name: Verify the cron did not touch the hand-curated overlays
        run: |
          changes=$(git status --porcelain -- data/law/overlays/)
          if [ -n "$changes" ]; then
            echo "The ingest modified hand-curated overlays. This must never happen:"
            echo "$changes"
            exit 1
          fi

      - name: Report what changed
        id: changes
        run: |
          # IST, to match the schedule this job is described by.
          echo "date=$(TZ=Asia/Kolkata date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- data/ docs/DATA-GAPS.md scripts/ingest/reports/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in the NCRB tables since the last run."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- data/ docs/DATA-GAPS.md scripts/ingest/reports/
          fi

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      # A refresh that breaks the dataset contract must not become a pull
      # request that looks routine. The Python ingest has already validated
      # against schemas/; this is the consumer side, plus every other check.
      - name: Validate the refreshed data
        if: steps.changes.outputs.changed == 'true'
        run: pnpm check

      - name: Open a pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/law-refresh
          delete-branch: true
          commit-message: 'data(law): NCRB refresh ${{ steps.changes.outputs.date }}'
          title: 'data(law): NCRB refresh ${{ steps.changes.outputs.date }}'
          add-paths: |
            data/
            docs/DATA-GAPS.md
            scripts/ingest/reports/
          labels: data, automated
          body: |
            The weekly NCRB Sankalan refresh found a change in the published
            correspondence tables.

            **Read the diff before merging.** This is section-level criminal law;
            a wrong mapping shown to an officer is worse than a stale one.

            What to look at, in order:

            - `docs/DATA-GAPS.md` — the generated coverage block. A count that
              jumps is the first sign the source changed shape rather than
              content.
            - `data/law/*.json` — the mappings themselves. A large diff on a run
              that should have been quiet usually means a parser change, not an
              NCRB change.
            - `data/_meta/versions.json` — `rows` and `sha256` per dataset.

            `data/law/overlays/` is hand-curated and this job cannot write to it;
            a step in this workflow fails if it ever does.

            Generated by `.github/workflows/ingest-law.yml`. Never auto-merged.
