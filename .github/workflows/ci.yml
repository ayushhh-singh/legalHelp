name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fonts come from @fontsource packages now (ADR-010); the licence file
      # they ship with is generated and committed, so this guards against drift.
      - name: Verify the bundled font licences are current
        run: pnpm fonts:licenses && git diff --exit-code public/OFL.txt

      - name: Lint, typecheck, i18n parity, unit tests
        run: pnpm check

      - name: Build
        run: pnpm build

      # Re-run after the build so the dist-only assertions actually execute.
      # bundle-budget also proves the AI layer is not in the initial route,
      # which is a privacy property here, not a performance one (ADR-011).
      - name: Verify the build makes no third-party requests and stays in budget
        run: pnpm exec vitest run tests/no-external-urls.test.ts tests/bundle-budget.test.ts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Builds and serves dist/ itself (playwright.config.ts webServer) — the
      # service worker, the real fonts and axe's colour-contrast rule all need
      # a production build in a real browser.
      - name: End-to-end (offline shell, axe, theme, typography)
        run: pnpm test:e2e
