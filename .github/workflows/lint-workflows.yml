name: Lint workflows

# A separate, tiny workflow rather than a job folded into ci.yml: several
# sessions can be editing .github/workflows/*.yml concurrently, and this has
# nothing else in common with what ci.yml verifies (the app, not its own
# CI). Runs on any change under .github/workflows/ so a broken workflow file
# is caught before it merges, not discovered the next time a cron fires.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error
