name: Glossary rebuild

# Dispatch only, deliberately — no schedule. `glossary_seed.py` reaches no
# host at all (see its own docstring and scripts/ingest/README.md): the
# 1,891 term pairs are hand-authored in `scripts/ingest/glossary_sources/
# *.json`, not fetched from anywhere, because the one page that would answer
# this (rajbhasha.gov.in's Saral Prashasanik Shabdavali PDF) exceeded
# WebFetch's ceiling in the session that built this dataset
# (docs/DATA-GAPS.md #48). There is nothing on a clock for this workflow to
# poll — a schedule would just rebuild identical output from identical
# inputs every week and, per `write_json`, write nothing, silently, forever.
#
# What this workflow is actually for: a reviewer who has just hand-edited
# `scripts/ingest/glossary_sources/*.json` or `data/drafting/
# structure-terms.json` (which `glossary_seed.py` excludes terms against) can
# run it here instead of locally, and get the same schema-validated rebuild
# and pull request `pnpm check` would give them on their own machine.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ingest-glossary
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ingest/requirements.txt

      - name: Install the ingest dependencies
        run: pip install -r scripts/ingest/requirements.txt

      - name: Unit-test the parsers before trusting them with a rebuild
        run: python -m unittest discover -s scripts/ingest -t scripts/ingest -v

      - name: Rebuild data/glossary.json
        run: python scripts/ingest/glossary_seed.py

      - name: Anything to propose?
        id: changes
        run: |
          if git status --porcelain -- data/glossary.json data/_meta/versions.json scripts/ingest/reports/glossary-drops.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- data/glossary.json data/_meta/versions.json scripts/ingest/reports/glossary-drops.json
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data/glossary.json already matches what glossary_seed.py builds from the committed sources."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate the rebuilt data
        if: steps.changes.outputs.changed == 'true'
        run: pnpm check

      - name: Open a pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: data/glossary-rebuild
          delete-branch: true
          commit-message: 'data(glossary): rebuild from scripts/ingest/glossary_sources'
          title: 'data(glossary): rebuild from scripts/ingest/glossary_sources'
          add-paths: |
            data/glossary.json
            data/_meta/versions.json
            scripts/ingest/reports/glossary-drops.json
          labels: data, automated
          body: |
            Manually dispatched rebuild of `data/glossary.json` from
            `scripts/ingest/glossary_sources/*.json` and `data/drafting/structure-terms.json`
            (the dataset it excludes terms against). Every entry still carries `verify: true`,
            unconditionally — this dataset is compiled, not extracted from a cited page
            (docs/DATA-GAPS.md #48) — and this workflow does not change that.

            **Read the diff before merging.** `scripts/ingest/reports/glossary-drops.json` names
            every term dropped as a cross-category duplicate or as already covered by
            `structure-terms.json`, so a term that unexpectedly stops appearing is traceable there.

            Generated by `.github/workflows/ingest-glossary.yml`. Never auto-merged.
