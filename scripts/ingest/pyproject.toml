[project]
name = "sahayak-ingest"
version = "0.2.0"
description = "Public-source data ingestion for Sahayak. Runs in CI and on a developer machine; never in the browser."
requires-python = ">=3.12"
dependencies = [
  "requests==2.34.2",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "pdfplumber==0.11.10",
  "pymupdf==1.28.2",
  "jsonschema==4.26.0",
  "rapidfuzz==3.14.6",
]

[project.scripts]
ncrb-sankalan = "ncrb_sankalan:main"
indiacode-seed = "indiacode_seed:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ingest_common", "ncrb_sankalan", "indiacode_seed"]
